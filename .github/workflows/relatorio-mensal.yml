name: Relatório financeiro mensal

on:
  schedule:
    - cron: '0 11 1 * *'   # todo dia 1, 11:00 UTC = 08:00 em Brasília
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

jobs:
  relatorio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relatorio-mensal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: relatorio-mensal/requirements.txt
      - run: pip install -r requirements.txt
      - run: python relatorio.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          SALDO_10X_PIX: ${{ vars.SALDO_10X_PIX }}
          SALDO_10X_PIX_DATA: ${{ vars.SALDO_10X_PIX_DATA }}
